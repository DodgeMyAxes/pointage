appId: fr.thomas.pointage
productName: Pointage
copyright: Thomas
# Publication faite à la main (gh release create, voir CLAUDE.md) : electron-builder ne publie rien.
publish: null
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
win:
  target: nsis
  icon: build/icone.ico
nsis:
  # Installation pour l'utilisateur seul, sans droits administrateur, en un clic.
  oneClick: true
  perMachine: false
  shortcutName: Pointage
  runAfterFinish: true
  # Aucun raccourci créé par l'installateur : sa création échouait sur un PC d'entreprise (« Erreur non spécifiée »
  # sur Pointage.lnk) et arrêtait l'installation. Pointage installé crée lui-même son raccourci du menu Démarrer.
  createStartMenuShortcut: false
  createDesktopShortcut: false
  artifactName: Pointage-Installation-${version}.exe
