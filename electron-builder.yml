appId: fr.thomas.pointage
productName: Pointage
copyright: Thomas Ruiz
# Publication faite à la main (gh release create, voir CLAUDE.md) : electron-builder ne publie rien.
publish: null
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
win:
  target: nsis
  icon: build/icone.ico
nsis:
  # Installateur assisté : « pour tous les utilisateurs » (Program Files, droits administrateur demandés) ou « pour moi
  # seulement » (AppData, sans droits). Un PC d'entreprise peut interdire les programmes dans AppData : Pointage.exe y
  # est alors refusé (« Windows ne parvient pas à accéder au périphérique… »), d'où le choix, et celui du dossier.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: Pointage
  runAfterFinish: true
  # Raccourcis faits à part (build/installer.nsh pour le bureau, Pointage lui-même pour le menu Démarrer) : leur création
  # par electron-builder échouait sur un PC d'entreprise (« Erreur non spécifiée »
  # sur Pointage.lnk) et arrêtait l'installation.
  createStartMenuShortcut: false
  createDesktopShortcut: false
  artifactName: Pointage-Installation-${version}.exe
